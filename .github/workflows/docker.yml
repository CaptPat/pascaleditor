name: Build and push Docker image

# Builds the production image and pushes it to GHCR (ghcr.io/captpat/pascaleditor)
# whenever main is updated. Image is consumed by the Andromeda cluster's
# ai-stack via docker-compose; see CaptPat/ai-stack for the service entry.
#
# Auth uses the workflow's GITHUB_TOKEN (no PAT or repository secrets needed).
# The token has `packages: write` for this repo's GHCR namespace.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tooling/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/captpat/pascaleditor
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Pascal Editor
            org.opencontainers.image.description=3D scene editor (CaptPat fork) for the Andromeda cluster
            org.opencontainers.image.source=https://github.com/CaptPat/pascaleditor

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
